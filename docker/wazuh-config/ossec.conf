<ossec_config>
  <!-- SOC L1 Lab Configuration - Login Anomaly Detection -->
  
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>yes</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
    <white_list>127.0.0.1</white_list>
    <white_list>10.10.10.0/24</white_list>
  </global>

  <client_buffer>
    <disable>no</disable>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- SSH Brute Force Detection Rules -->
  <ruleset>
    <!-- Default decoders -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <decoder_dir>etc/decoders</decoder_dir>
    
    <!-- Default rules -->
    <rule_dir>ruleset/rules</rule_dir>
    <rule_dir>etc/rules</rule_dir>
    
    <!-- Include custom rules -->
    <include>etc/rules/local_rules.xml</include>
  </ruleset>

  <!-- Active Response Configuration -->
  <active-response>
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <!-- Remote Syslog Configuration -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>10.10.10.0/24</allowed-ips>
  </remote>

  <!-- Integration with SOC L1 Lab -->
  <integration>
    <name>custom-soc-integration</name>
    <hook_url>http://10.10.10.12:5601</hook_url>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- Log Analysis Configuration -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <!-- Docker Monitoring -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/lib/docker/containers/*/*.log</location>
  </localfile>

</ossec_config>
